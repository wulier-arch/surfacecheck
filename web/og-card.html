<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>surfacecheck — og card</title>
<!--
  1200×630 社交预览图模板。
  没有被任何页面引用，只用来生成 web/og.png：
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --screenshot=web/og.png \
      --window-size=1200,630 --hide-scrollbars web/og-card.html
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #0b0e14; color: #d8dfea;
    font: 15px -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#1a2333 1px, transparent 1px),
      linear-gradient(90deg, #1a2333 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: .28;
  }
  .fade {
    position: absolute; inset: 0;
    background: radial-gradient(900px 460px at 12% 0%, rgba(77,157,255,.20), transparent 68%),
                linear-gradient(180deg, transparent 40%, #0b0e14 96%);
  }
  .inner { position: relative; padding: 66px 76px; height: 100%; display: flex; flex-direction: column; }

  .brand { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(145deg, #16233a, #0d131f);
    border: 1px solid #2a3c57; display: grid; place-items: center;
  }
  h1 { font: 700 46px/1 ui-monospace, Menlo, monospace; letter-spacing: -1.5px; color: #fff; }
  .ver { font: 15px ui-monospace, monospace; color: #55627a; margin-left: 14px; letter-spacing: 0; }

  .pitch {
    margin-top: 34px; font-size: 25px; line-height: 1.5; color: #a9b6c9; max-width: 900px;
  }
  .pitch b { color: #fff; font-weight: 600; }

  .rows { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: flex; align-items: center; gap: 14px;
    background: #0f1520; border: 1px solid #1c2534; border-left-width: 3px;
    border-radius: 9px; padding: 13px 18px;
  }
  .row.c { border-left-color: #ff4d5e; }
  .row.h { border-left-color: #ffab2e; }
  .row.r { border-left-color: #7c889b; }
  .tag { font: 11px ui-monospace, monospace; padding: 4px 8px; border-radius: 4px; flex: none; }
  .row.c .tag { background: #3a1620; color: #ff4d5e; }
  .row.h .tag { background: #33290f; color: #ffab2e; }
  .row.r .tag { background: #1c222e; color: #8b96a8; }
  .row .what { font-size: 16px; font-weight: 600; }
  .row .val { font: 13px ui-monospace, monospace; color: #6f7c90; margin-left: auto; }

  .foot {
    margin-top: 26px; display: flex; align-items: center; gap: 22px;
    font: 13px ui-monospace, monospace; color: #4d5768;
  }
  .foot .sep { width: 1px; height: 13px; background: #232d3d; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="fade"></div>
  <div class="inner">
    <div class="brand">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M4 12.5l5 5L20 6.5" stroke="#4d9dff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>surfacecheck<span class="ver">v0.2.0</span></h1>
    </div>

    <p class="pitch">
      凭据泄露、证书过期、安全头缺失、依赖漏洞 —— <b>一次扫完</b>，<br>
      按「能不能立刻被利用」排序，不按字母排序。
    </p>

    <div class="rows">
      <div class="row c">
        <span class="tag">严重</span>
        <span class="what">AWS Access Key ID</span>
        <span class="val">config/prod.env:3</span>
      </div>
      <div class="row h">
        <span class="tag">高</span>
        <span class="what">laravel/framework 8.83.0 有已知漏洞</span>
        <span class="val">CVE-2026-48019 · CVSS 8.9</span>
      </div>
      <div class="row h">
        <span class="tag">高</span>
        <span class="what">没防点击劫持</span>
        <span class="val">example.com</span>
      </div>
      <div class="row r">
        <span class="tag">待确认</span>
        <span class="what">证书剩余寿命不足三分之一</span>
        <span class="val">剩 20/64 天</span>
      </div>
    </div>

    <div class="foot">
      <span>0 依赖</span>
      <span class="sep"></span>
      <span>148 个测试</span>
      <span class="sep"></span>
      <span>Node ≥20</span>
      <span class="sep"></span>
      <span>github.com/wulier-arch/surfacecheck</span>
    </div>
  </div>
</body>
</html>
