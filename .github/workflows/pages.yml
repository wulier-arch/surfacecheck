name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 组装站点
        run: |
          set -eu
          mkdir -p _site
          # 页面放在站点根，这样 ../src/ 和 ./src/ 两种相对路径都能落到 src/
          cp web/index.html _site/index.html
          cp web/app.js _site/app.js
          cp web/og.png _site/og.png
          cp web/screenshot.png _site/screenshot.png
          cp -R src _site/src

      - name: 确认站点里该有的文件都在
        run: |
          set -eu
          for file in index.html app.js og.png src/scan-text.mjs src/patterns.mjs; do
            test -f "_site/$file" || { echo "缺文件：_site/$file"; exit 1; }
          done
          echo "站点文件齐全"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
